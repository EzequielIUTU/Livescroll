<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050608">
  <title>Preview · Intro LiveScroll 6</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}
    .preview-restart{position:fixed;z-index:10001;top:14px;right:14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(5,6,8,.76);color:rgba(255,255,255,.65);padding:8px 12px;font:700 10px system-ui;cursor:pointer}
    *{box-sizing:border-box}.ls6-cinematic{--g:#f7d34b;--gb:#fff1a3;position:fixed;inset:0;z-index:9999;overflow:hidden;display:grid;place-items:center;background:#050608;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif}.ls6-stars{position:absolute;inset:0;opacity:.3;background-image:radial-gradient(circle at 20% 25%,#f7d34b 0 1px,transparent 1.5px),radial-gradient(circle at 72% 18%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 82% 70%,#f7d34b 0 1px,transparent 1.5px),radial-gradient(circle at 30% 76%,#fff 0 1px,transparent 1.5px);background-size:240px 230px,310px 280px,270px 320px,350px 300px;animation:stars 9s linear infinite}.ls6-gold-seed{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gb);box-shadow:0 0 22px 7px #f7d34b88;opacity:0}.ls6-scene{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;opacity:0;visibility:hidden}.ls6-kicker,.ls6-small{font:800 10px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#f7d34bb8}.ls6-scene-welcome h1{margin:24px 0 0;font-size:clamp(31px,6vw,62px);line-height:1.03;letter-spacing:-.045em}.ls6-scene-welcome h1 em{font-style:normal;color:var(--g)}.ls6-gold-interface{position:relative;width:190px;height:190px;margin-top:25px;display:grid;place-items:center;transform-style:preserve-3d}.ls6-gold-interface>span{position:absolute;inset:12px;border:1px solid #f7d34b55;transform:rotate(45deg);animation:turn 7s linear infinite}.ls6-gold-interface>span:nth-child(2){inset:33px;border-radius:50%;transform:rotateX(66deg);animation-duration:5s}.ls6-gold-interface>span:nth-child(3){inset:49px;transform:rotate(18deg);animation-duration:8s;animation-direction:reverse}.ls6-gold-interface>span:nth-child(4){inset:0;border-radius:50%;transform:rotateY(68deg);animation-duration:6s}.ls6-interface-core{width:65px;height:65px;border-radius:18px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#090a0d;background:linear-gradient(145deg,var(--gb),#d99c16);box-shadow:0 0 45px #f7d34b44}.ls6-impact-text{font-size:clamp(54px,13vw,132px);font-weight:900;letter-spacing:-.06em;color:#090a0d}.ls6-message{margin-top:18px;font-size:clamp(28px,6.5vw,68px);font-weight:700;line-height:1.03;letter-spacing:-.05em}.ls6-message strong{color:var(--g);font-weight:900}.ls6-six{font-size:clamp(180px,43vw,430px);font-weight:900;line-height:.75;color:transparent;background:linear-gradient(110deg,#8f5d08,#fff1a3 38%,#c8860c 68%,#f7d34b);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 24px 35px #f7d34b33)}.ls6-six-caption{margin-top:35px;font:900 10px 'JetBrains Mono',monospace;letter-spacing:.22em;color:#ffffff88}.ls6-path-line{position:absolute;left:50%;bottom:-12%;width:3px;height:78%;background:linear-gradient(transparent,var(--g),transparent);box-shadow:0 0 22px #f7d34bcc;transform:perspective(500px) rotateX(58deg);transform-origin:bottom}.ls6-brand-union{display:flex;align-items:baseline;justify-content:center;font-size:clamp(48px,12vw,124px);font-weight:900;letter-spacing:-.07em;white-space:nowrap}.ls6-scroll{color:var(--g)}.ls6-brand-six{margin-left:.11em;color:var(--g)}.ls6-coming{margin-top:20px;padding:8px 18px;border:1px solid #f7d34b66;border-radius:999px;font:900 11px 'JetBrains Mono',monospace;letter-spacing:.24em;color:var(--g);background:#f7d34b11}.ls6-next{position:absolute;z-index:9;right:24px;bottom:28px;min-width:142px;padding:13px 18px;border:1px solid #f7d34b77;border-radius:999px;background:#08090bcf;color:#fff;font:800 12px 'Space Grotesk',sans-serif;cursor:pointer}.ls6-next span{color:var(--g);margin-left:7px;font-size:16px}.ls6-progress{position:absolute;z-index:9;left:24px;bottom:36px;display:flex;gap:6px}.ls6-progress i{width:18px;height:3px;border-radius:5px;background:#ffffff22}.ls6-cinematic[data-scene="0"] .ls6-progress i:nth-child(1),.ls6-cinematic[data-scene="1"] .ls6-progress i:nth-child(-n+2),.ls6-cinematic[data-scene="2"] .ls6-progress i:nth-child(-n+3),.ls6-cinematic[data-scene="3"] .ls6-progress i:nth-child(-n+4),.ls6-cinematic[data-scene="4"] .ls6-progress i:nth-child(-n+5),.ls6-cinematic[data-scene="5"] .ls6-progress i{background:var(--g)}.ls6-cinematic[data-scene="0"] .ls6-scene-welcome{visibility:visible;animation:rise .65s ease both}.ls6-cinematic[data-scene="1"] .ls6-scene-year{visibility:visible;animation:year .75s ease both}.ls6-cinematic[data-scene="1"] .ls6-gold-seed{animation:expand .75s ease both}.ls6-cinematic[data-scene="2"] .ls6-scene-influencer,.ls6-cinematic[data-scene="4"] .ls6-scene-path{visibility:visible;animation:rise .7s ease both}.ls6-cinematic[data-scene="3"] .ls6-scene-six{visibility:visible;animation:reveal .4s ease both}.ls6-cinematic[data-scene="3"] .ls6-six{animation:six 1.05s ease both,spin 7s 1.05s linear infinite}.ls6-cinematic[data-scene="5"] .ls6-scene-union{visibility:visible;animation:reveal .4s ease both}.ls6-cinematic[data-scene="5"] .ls6-live{animation:live .8s ease both}.ls6-cinematic[data-scene="5"] .ls6-scroll{animation:scroll .8s .08s ease both}.ls6-cinematic[data-scene="5"] .ls6-brand-six{animation:brand6 .8s .16s ease both}.ls6-cinematic[data-scene="5"] .ls6-coming{animation:coming .42s .82s ease both}@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}@keyframes reveal{to{opacity:1}}@keyframes year{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:scale(1)}}@keyframes expand{from{opacity:1;transform:scale(1)}to{opacity:1;transform:scale(230)}}@keyframes six{from{opacity:0;transform:rotateY(-170deg) scale(.2)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotateY(360deg)}}@keyframes live{from{opacity:0;transform:translateX(-65vw)}to{opacity:1;transform:none}}@keyframes scroll{from{opacity:0;transform:translateY(-55vh)}to{opacity:1;transform:none}}@keyframes brand6{from{opacity:0;transform:translateX(55vw) rotate(120deg)}to{opacity:1;transform:none}}@keyframes coming{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}@keyframes turn{to{rotate:1 1 .4 360deg}}@keyframes stars{to{background-position:40px 20px,-30px 25px,25px -35px,-25px -20px}}@media(max-width:600px){.ls6-next{left:22px;right:22px;bottom:24px;width:calc(100% - 44px)}.ls6-progress{left:50%;bottom:86px;transform:translateX(-50%)}.ls6-gold-interface{width:160px;height:160px}}
    .ls6-sparkles{position:absolute;left:50%;top:50%;width:min(620px,88vw);height:210px;transform:translate(-50%,-50%);pointer-events:none}.ls6-sparkles i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff1a3;box-shadow:0 0 12px 3px #f7d34baa;opacity:0}.ls6-sparkles i:nth-child(1){left:5%;top:45%}.ls6-sparkles i:nth-child(2){left:17%;top:15%}.ls6-sparkles i:nth-child(3){left:31%;top:78%}.ls6-sparkles i:nth-child(4){left:47%;top:8%}.ls6-sparkles i:nth-child(5){left:62%;top:82%}.ls6-sparkles i:nth-child(6){left:76%;top:18%}.ls6-sparkles i:nth-child(7){left:89%;top:58%}.ls6-sparkles i:nth-child(8){left:55%;top:38%}.ls6-cinematic[data-scene="5"] .ls6-live{animation:live 1.35s ease both}.ls6-cinematic[data-scene="5"] .ls6-scroll{animation:scroll 1.35s .18s ease both}.ls6-cinematic[data-scene="5"] .ls6-brand-six{animation:brand6 1.35s .36s ease both}.ls6-cinematic[data-scene="5"] .ls6-sparkles i{animation:spark 1.2s 1.25s ease-out both}.ls6-cinematic[data-scene="5"] .ls6-sparkles i:nth-child(2n){animation-delay:1.38s}.ls6-cinematic[data-scene="5"] .ls6-sparkles i:nth-child(3n){animation-delay:1.5s}.ls6-cinematic[data-scene="5"] .ls6-coming{animation:coming .5s 1.62s ease both}@keyframes spark{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.45) rotate(90deg)}100%{opacity:0;transform:scale(.25) rotate(180deg) translateY(-20px)}}
  </style>
</head>
<body>
<button class="preview-restart" onclick="location.reload()">↻ Reiniciar preview</button>
<div id="introOverlay" class="ls6-cinematic" data-scene="0" role="dialog" aria-label="Presentación de LiveScroll 6">
  <div class="ls6-stars"></div><div class="ls6-gold-seed"></div>
  <section class="ls6-scene ls6-scene-welcome"><div class="ls6-kicker">UNA NUEVA ETAPA ESTÁ POR COMENZAR</div><div class="ls6-gold-interface"><span></span><span></span><span></span><span></span><div class="ls6-interface-core">LS</div></div><h1>El futuro de LiveScroll<br><em>empieza acá.</em></h1></section>
  <section class="ls6-scene ls6-scene-year"><div class="ls6-impact-text">ESTE AÑO</div></section>
  <section class="ls6-scene ls6-scene-influencer"><div class="ls6-small">TU HISTORIA PUEDE CAMBIAR</div><div class="ls6-message">PODÉS SER EL PRÓXIMO<br><strong>INFLUENCER ARGENTINO</strong></div></section>
  <section class="ls6-scene ls6-scene-six"><div class="ls6-six">6</div><div class="ls6-six-caption">LA PRÓXIMA GENERACIÓN</div></section>
  <section class="ls6-scene ls6-scene-path"><div class="ls6-path-line"></div><div class="ls6-message">PREPARATE PARA RECORRER<br><strong>ESTE CAMINO JUNTOS</strong></div></section>
  <section class="ls6-scene ls6-scene-union"><div class="ls6-brand-union"><span class="ls6-live">Live</span><span class="ls6-scroll">Scroll</span><span class="ls6-brand-six">6</span></div><div class="ls6-sparkles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ls6-coming">PRÓXIMAMENTE</div></section>
  <button id="ls6NextButton" class="ls6-next" type="button" onclick="advancePreview(event)">Siguiente <span>→</span></button>
  <div id="soundStatus" style="position:absolute;z-index:10000;right:27px;bottom:82px;font:700 9px system-ui;color:#ffffff77">🔇 El sonido se activa al continuar</div>
  <div class="ls6-progress"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <audio id="previewMusic" src="violet-sky-livescroll.mp3" preload="none" loop></audio>
</div>
<script>
let scene=0,audioCtx=null,musicGain=null;
function music(){try{if(musicGain)return;const m=document.getElementById('previewMusic');m.volume=.48;m.play().then(()=>{musicGain=true;document.getElementById('soundStatus').textContent='🔊 Violet Sky · FiftySounds'}).catch(()=>{document.getElementById('soundStatus').textContent='🔇 Abrí el preview descargado con Chrome'})}catch(_){}}
function sound(kind){try{audioCtx=audioCtx||new(AudioContext||webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=kind==='impact'?'sawtooth':'sine';o.frequency.setValueAtTime(kind==='impact'?115:430,n);o.frequency.exponentialRampToValueAtTime(kind==='impact'?42:120,n+(kind==='impact'?.28:.18));g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(kind==='impact'?.13:.055,n+.018);g.gain.exponentialRampToValueAtTime(.0001,n+(kind==='impact'?.34:.22));o.start(n);o.stop(n+.36)}catch(_){}}
function advancePreview(e){e.stopPropagation();music();scene++;if(scene>5){scene=0}const el=document.getElementById('introOverlay');el.dataset.scene=String(scene);sound(scene===1||scene===3||scene===5?'impact':'whoosh');const b=document.getElementById('ls6NextButton');b.innerHTML=scene===5?'Repetir <span>↻</span>':'Siguiente <span>→</span>'}
</script>
</body>
</html>
